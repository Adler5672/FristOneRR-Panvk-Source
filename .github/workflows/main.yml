name: Build PanVK ARM64 glibc

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git meson ninja-build pkg-config \
            python3 python3-mako python3-yaml python3-ply \
            python3-packaging python3-jinja2 python3-jsonschema \
            flex bison byacc \
            libdrm-dev libx11-dev libxext-dev libxcb1-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxshmfence-dev \
            libexpat1-dev zlib1g-dev libzstd-dev libelf-dev

      - name: Configure Mesa
        run: |
          meson setup build \
            --prefix=/usr \
            --libdir=lib \
            -Dplatforms=x11 \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dgallium-drivers=[] \
            -Dopengl=false \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dbuild-tests=false

      - name: Compile
        run: |
          ninja -C build

      - name: Package
        run: |
          mkdir -p artifact/lib
          cp build/src/panfrost/vulkan/libvulkan_panfrost.so artifact/lib/
          find build -name '*panfrost*.json' -exec cp {} artifact/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-arm64-glibc
          path: artifact/
