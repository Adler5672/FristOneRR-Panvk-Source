
name: PanVK kbase debug Mesa

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kbase-debug:
    name: Build PanVK kbase debug Mesa
    runs-on: ubuntu-26.04-arm

    container:
      image: ubuntu:26.04

    env:
      ARTIFACT_NAME: mesa-panvk-kbase-debug-aarch64
      BUILD_DIR: build
      INSTALL_PREFIX: /opt/mesa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            bison \
            git \
            cmake \
            clang \
            ninja-build \
            libxrandr-dev \
            build-essential \
            ca-certificates \
            flex \
            libxcb-dri3-dev \
            libdrm-dev \
            libelf-dev \
            libexpat1-dev \
            libclang-cpp-dev \
            libclang-dev \
            libwayland-dev \
            libxcb-present-dev \
            libwayland-egl-backend-dev \
            pkgconf \
            python3 \
            python3-mako \
            python3-packaging \
            python3-pip \
            python3-setuptools \
            python3-yaml \
            llvm-dev \
            glslang-tools \
            spirv-tools \
            spirv-headers \
            spirv-tools-dev \
            libunwind-dev \
            wayland-protocols \
            spirv-tools-headers \
            libxshmfence-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            zlib1g-dev \
            zip

          LLVM_MAJOR="$(llvm-config --version | cut -d. -f1)"

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            "libclc-${LLVM_MAJOR}-dev" \
            "libllvmspirvlib-${LLVM_MAJOR}-dev"

      - name: Install Meson
        shell: bash
        run: |
          python3 -m pip install --break-system-packages \
            'meson>=1.4.0,<2'

      - name: Check SPIRV-Tools
        shell: bash
        run: |
          set -eux
          which spirv-link
          spirv-link --help

      - name: Configure Mesa
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -eux

          meson setup build \
            --prefix="${INSTALL_PREFIX}" \
            --libdir=lib \
            -Dplatforms=x11 \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dgallium-drivers=[] \
            -Dopengl=false \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dllvm=enabled \
            -Ddraw-use-llvm=false \
            -Dbuild-tests=false
            -Dbuildtype=release
            -Dpanfrost-rust=false

      - name: Build
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -eux
          meson compile -C "${BUILD_DIR}" -j "$(nproc)"

       - name: Upload libpan SPIR-V on failure
        if: failure()
        ses: actions/upload-artifact@v4
        with:
             name: libpan-spv
             path: ${{ github.workspace }}/build/src/panfrost/libpan/*.spv
             if-no-files-found: ignore
             retention-days: 7

      - name: Install
        shell: bash
        run: |
          set -eux

          rm -rf artifacts
          mkdir -p artifacts/install-root

          meson install -C "${BUILD_DIR}" \
            --destdir "${GITHUB_WORKSPACE}/artifacts/install-root"

      - name: Create zip package
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/artifacts/install-root"

          zip -r \
            "${GITHUB_WORKSPACE}/${ARTIFACT_NAME}.zip" \
            opt/mesa

      - name: Upload Mesa package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Meson logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-logs
          path: ${{ github.workspace }}/build/meson-logs
          if-no-files-found: ignore
          retention-days: 7
